name: Import Tidy-Toters (subtree)

on:
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add source remote
        run: |
          # Use public HTTPS remote since repo is public
          git remote add tidy https://github.com/methatsmeyesitsme/Tidy-Toters.git
          git fetch tidy --tags --prune

      - name: Create import branch
        run: |
          git checkout -b import/tidy-toters

      - name: Import subtree (preserve history)
        run: |
          git remote set-head tidy --auto SRC_BRANCH=$(git symbolic-ref --short refs/remotes/tidy/HEAD | sed 's@^tidy/@@') echo "Using source branch: $SRC_BRANCH" git subtree add --prefix=tidy-toters tidy "$SRC_BRANCH"

      - name: Push import branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin import/tidy-toters --force

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: Import Tidy-Toters via subtree
          branch: import/tidy-toters
          title: Import Tidy-Toters (subtree)
          body: |
            Imports the Tidy-Toters repository into tidy-toters/ with preserved history.
          base: main
